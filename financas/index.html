<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Carteira</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1>Carteira</h1>
  <div class="mes">
    <button id="prev" aria-label="Mês anterior">‹</button>
    <span id="mesLabel"></span>
    <button id="next" aria-label="Próximo mês">›</button>
  </div>
</header>

<main>
  <section class="cards">
    <div class="card"><span>Receitas</span><strong id="totReceitas" class="pos"></strong></div>
    <div class="card"><span>Despesas</span><strong id="totDespesas" class="neg"></strong></div>
    <div class="card"><span>Saldo do mês</span><strong id="saldoMes"></strong></div>
    <div class="card"><span>Saldo geral</span><strong id="saldoGeral"></strong></div>
  </section>

  <section class="painel">
    <h2>Novo lançamento</h2>
    <form id="form">
      <div class="tipo">
        <label><input type="radio" name="tipo" value="despesa" checked> Despesa</label>
        <label><input type="radio" name="tipo" value="receita"> Receita</label>
      </div>
      <input id="desc" placeholder="Descrição" required maxlength="60">
      <input id="valor" type="number" step="0.01" min="0.01" placeholder="Valor (R$)" required>
      <select id="cat"></select>
      <input id="data" type="date" required>
      <label class="check"><input type="checkbox" id="pago" checked> Pago / recebido</label>
      <button type="submit">Adicionar</button>
    </form>
  </section>

  <section class="painel">
    <h2>Gastos por categoria</h2>
    <div id="grafico"></div>
  </section>

  <section class="painel">
    <h2>Orçamento mensal</h2>
    <form id="formOrc" class="linha">
      <select id="orcCat"></select>
      <input id="orcValor" type="number" step="0.01" min="0" placeholder="Limite (R$)">
      <button type="submit">Definir</button>
    </form>
    <div id="orcamentos"></div>
  </section>

  <section class="painel">
    <div class="titulo-lista">
      <h2>Lançamentos</h2>
      <select id="filtro">
        <option value="todos">Todos</option>
        <option value="receita">Receitas</option>
        <option value="despesa">Despesas</option>
        <option value="pendente">Pendentes</option>
      </select>
    </div>
    <ul id="lista"></ul>
  </section>

  <section class="painel acoes">
    <button id="exportar">Exportar backup</button>
    <label class="botao">Importar backup<input type="file" id="importar" accept=".json" hidden></label>
  </section>
</main>
<script src="app.js"></script>
</body>
</html>
