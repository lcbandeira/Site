    {name: 'resumo_do_mes', description: 'Retorna totais de um mês (receitas, despesas, saldos das contas, faturas dos cartões, despesas por categoria, orçamentos e nota de saúde financeira). Use primeiro para perguntas gerais.',
      inputSchema: {type: 'object', properties: {mes: {type: 'string', description: 'AAAA-MM; padrão: mês aberto no app'}}},
      execute: ({mes}) => { const ym = /^\d{4}-\d{2}$/.test(String(mes)) ? String(mes) : ui.ym; const mt = monthTotals(ym); const byC = byCategory(ym, 'expense');
        return {mes: ym, hoje: todayStr(), receitas: mt.inc, receitas_recebidas: mt.incP, despesas: mt.exp, despesas_pagas: mt.expP, despesas_no_cartao: mt.cardExp, pendentes: {quantidade: mt.pendN, valor: mt.pendV},
          contas: D().accounts.filter(a => !a.archived).map(a => ({nome: a.name, tipo: KIND[a.kind], saldo_hoje: accountBalance(a.id, todayStr(), true), saldo_previsto_fim_do_mes: accountBalance(a.id, endOf(ym), false)})),
          cartoes: D().cards.map(c => { const i = invoice(c.id, ym); return {nome: c.name, fatura: i.total, pago: i.paid, vencimento: i.dueDate, limite: c.limit, limite_livre: round2(c.limit - i.used)}; }),
          despesas_por_categoria: byC.map(x => ({categoria: x.c.name, valor: x.v})), receitas_por_categoria: byCategory(ym, 'income').map(x => ({categoria: x.c.name, valor: x.v})),
          orcamentos: Object.entries(D().budgets).map(([c, v]) => ({categoria: cat(c).name, limite: v, gasto: byC.find(x => x.id === c)?.v || 0})),
          objetivos: D().goals.map(g => ({nome: g.name, objetivo: g.target, guardado: g.saved, prazo: g.deadline})), saude_financeira: health(ym).score}; }},
    {name: 'buscar_lancamentos', description: 'Lista lançamentos com filtros opcionais. Retorna no máximo 150, mais recentes primeiro, com o total.',
      inputSchema: {type: 'object', properties: {de: {type: 'string', description: 'data inicial AAAA-MM-DD'}, ate: {type: 'string', description: 'data final AAAA-MM-DD'}, tipo: {type: 'string', enum: ['despesa', 'receita', 'transferencia']}, categoria: {type: 'string'}, texto: {type: 'string', description: 'trecho da descrição ou tag'}, conta_ou_cartao: {type: 'string'}, so_pendentes: {type: 'boolean'}}},
      execute: f => { let l = store.allTx();
        if (f.de) l = l.filter(t => t.date >= String(f.de)); if (f.ate) l = l.filter(t => t.date <= String(f.ate));
        if (f.tipo) l = l.filter(t => t.type === {despesa: 'expense', receita: 'income', transferencia: 'transfer'}[f.tipo]);
        if (f.categoria) { const c = findCat(String(f.categoria)); if (!c) throw new Error('Categoria não encontrada. Existentes: ' + D().cats.map(c => c.name).join(', ')); l = l.filter(t => t.cat === c.id); }
        if (f.texto) { const q = norm(f.texto); l = l.filter(t => norm(t.desc + ' ' + (t.tags || []).join(' ')).includes(q)); }
        if (f.conta_ou_cartao) { const s = findSrc(String(f.conta_ou_cartao)); if (!s) throw new Error('Conta ou cartão não encontrado.'); l = l.filter(t => s.card ? t.card === s.card : t.account === s.account || t.to === s.account); }
        if (f.so_pendentes) l = l.filter(t => statusOf(t) !== 'ok');
        l.sort((a, b) => b.date.localeCompare(a.date));
        const total = round2(l.reduce((s, t) => s + (t.type === 'income' ? t.amount : t.type === 'expense' ? -t.amount : 0), 0));
        return {quantidade: l.length, saldo_dos_filtrados: total, lancamentos: l.slice(0, 150).map(view)}; }},
    {name: 'criar_lancamento', description: 'Cria uma despesa, receita ou transferência no app. Use só quando a pessoa pedir claramente. Use nomes exatos de contas, cartões e categorias existentes.',
      inputSchema: {type: 'object', properties: {tipo: {type: 'string', enum: ['despesa', 'receita', 'transferencia']}, valor: {type: 'number'}, descricao: {type: 'string'}, data: {type: 'string', description: 'AAAA-MM-DD; padrão hoje'}, categoria: {type: 'string'}, conta_ou_cartao: {type: 'string'}, conta_destino: {type: 'string', description: 'só para transferência'}, efetivada: {type: 'boolean', description: 'padrão true'}, parcelas: {type: 'number', description: 'para compras parceladas; o valor é o total'}}, required: ['tipo', 'valor', 'descricao']},
      execute: f => {
        const type = {despesa: 'expense', receita: 'income', transferencia: 'transfer'}[f.tipo]; if (!type) throw new Error('tipo inválido');
        const amount = round2(+f.valor); if (!(amount > 0)) throw new Error('valor inválido');
        const date = /^\d{4}-\d{2}-\d{2}$/.test(String(f.data)) ? String(f.data) : todayStr();
        const src = f.conta_ou_cartao ? findSrc(String(f.conta_ou_cartao)) : {account: D().accounts[0]?.id};
        if (!src || (!src.account && !src.card)) throw new Error('Conta ou cartão não encontrado. Existentes: ' + [...D().accounts.map(a => a.name), ...D().cards.map(c => 'Cartão ' + c.name)].join(', '));
        const base = {type, desc: String(f.descricao).slice(0, 80), amount, date, paid: f.efetivada !== false, tags: [], created: Date.now(), byClaude: true};
        if (type === 'transfer') { const to = findSrc(String(f.conta_destino || '')); if (!to?.account || !src.account) throw new Error('Informe contas de origem e destino válidas.'); Object.assign(base, {account: src.account, to: to.account, paid: true}); }
        else { Object.assign(base, src); const c = f.categoria ? findCat(String(f.categoria), type) : null; base.cat = c?.id || guessCat(base.desc, type); }
        const n = Math.max(1, Math.min(60, Math.round(+f.parcelas || 1))); const made = [];
        if (n > 1) { const g = uid(), each = round2(amount / n); for (let i = 0; i < n; i++) made.push({...base, id: uid(), group: g, inst: {n: i + 1, of: n}, amount: i === n - 1 ? round2(amount - each * (n - 1)) : each, date: dateIn(addYm(ymOf(date), i), +date.slice(8)), paid: i === 0 ? base.paid : false}); }
        else made.push({...base, id: uid()});
        made.forEach(x => store.addTx(x)); store.saveData(); render();
        ui.chat.push({role: 'tool', content: `✓ ${made.length > 1 ? made.length + ' parcelas criadas' : 'Lançamento criado'}: ${base.desc}, ${BRL.format(amount)}`});
        return {criado: made.map(view)}; }},
    {name: 'listar_cadastros', description: 'Lista contas, cartões, categorias e tags existentes.', execute: () => ({contas: D().accounts.map(a => a.name), cartoes: D().cards.map(c => ({nome: c.name, fechamento: c.closing, vencimento: c.due, limite: c.limit})), categorias_despesa: D().cats.filter(c => c.type === 'expense').map(c => c.name), categorias_receita: D().cats.filter(c => c.type === 'income').map(c => c.name), tags: D().tags, emprestimos: D().loans.map(l => ({pessoa: l.person, tipo: l.dir === 'lent' ? 'emprestei' : 'devo', valor: l.amount, devolvido: l.paid}))})}
  ];
}
const CLAUDE_RULES = () => `Você é o Claude, assistente financeiro dentro do app Lastro (controle de finanças pessoais). Responda em português do Brasil, de forma direta e curta, com valores em reais (R$ 1.234,56). Hoje é ${todayStr()}; o mês aberto no app é ${ui.ym}.
Use as ferramentas para ler dados reais antes de responder; nunca invente números. Só crie lançamentos quando a pessoa pedir. Se faltar uma informação essencial (valor, conta), pergunte.

let chatCtl = null;
async function askClaude(text) {
  text = text.trim(); if (!text) return;
  if (ui.view !== 'claude') go('claude');
  ui.chat.push({role: 'user', content: text});
  const bubble = {role: 'assistant', content: 'Pensando...'}; ui.chat.push(bubble); render();
  const btn = $('#chatSend'); if (btn) btn.disabled = true;
  if (!sampleFn) { bubble.content = 'O Claude só funciona com o Lastro aberto no claude.ai, com sua conta.'; render(); return; }
  const turns = [{role: 'user', content: CLAUDE_RULES()}];
  ui.chat.filter(m => m.role !== 'tool' && m !== bubble).slice(-12).forEach(m => turns.push({role: m.role, content: m.content}));
  chatCtl = new AbortController();
  try {
    const {text: ans} = await sampleFn(turns, {cache: false, signal: chatCtl.signal, tools: claudeTools(), onText: ({text}) => { bubble.content = text; const c = $('#chat'); if (c) { c.lastElementChild.textContent = text; } }});
    bubble.content = ans;
  } catch (e) { bubble.content = e?.text || aiErr(e); }
  render();
}

let downloadsCap = null;
async function saveFile(filename, text, type) {
  if (downloadsCap) { try { await downloadsCap.save({filename, data: new Blob([text], {type})}); toast('Arquivo salvo.'); return; } catch (e) { if (e?.code === 'declined') return; } }
  sheet(`${sheetHead('Copiar conteúdo')}<p class="muted" style="margin:0">Não foi possível baixar o arquivo aqui. Copie o conteúdo abaixo e salve como <b>${esc(filename)}</b>.</p><div class="field"><textarea id="cpy" style="min-height:200px">${esc(text)}</textarea></div><button class="btn" id="cpyBtn">Copiar</button>`,
    el => el.querySelector('#cpyBtn').onclick = () => { navigator.clipboard.writeText(text).then(() => toast('Copiado.'), () => { el.querySelector('#cpy').select(); }); });
}
async function importBackup(file) {
  try {
    const j = JSON.parse(await file.text()); if (j.app !== 'lastro' || !j.data) throw 0;
    confirmSheet('Importar backup', 'Os dados deste perfil serão substituídos pelo conteúdo do arquivo. Um ponto de restauração é criado antes.', 'Importar', () => {
      store.snapshot('Antes de importar backup'); const snaps = D().snaps;
      Object.keys(store.months).forEach(ym => { store.months[ym] = []; store.saveMonth(ym); });
      store.data = Object.assign(blankData(), j.data, {snaps}); store.months = j.months || {}; Object.keys(store.months).forEach(ym => store.saveMonth(ym)); store.saveData(); go('inicio'); toast('Backup importado.');
    });
  } catch { toast('Arquivo inválido. Use um backup exportado pelo Lastro.'); }
}

    <form id="obForm" style="display:flex;flex-direction:column;gap:10px"><div class="field"><span>Como quer ser chamado?</span><input id="obName" required maxlength="30" placeholder="Seu nome"></div>
    <label class="check"><span><b>Começar com dados de exemplo</b><small>Contas, cartão e lançamentos fictícios para você explorar. Dá para apagar depois em Configurações.</small></span><input type="checkbox" class="switch" id="obDemo" checked></label>
    <button class="btn">Começar</button></form></section>`;
  $('#monthnav').hidden = true;
  $('#obForm').onsubmit = e => {
    e.preventDefault();
    const p = {id: uid(), name: $('#obName').value.trim()}; store.meta.profiles.push(p); store.meta.current = p.id; store.saveMeta(); store.openProfile(p.id);
    if ($('#obDemo').checked) seedDemo();
    store.saveData(); go('inicio');
  };
}
function seedDemo() {

  const a2 = {id: uid(), name: 'Carteira (exemplo)', kind: 'wallet', initial: 120, color: '#e2b23a', inTotal: true};

  const c1 = {id: uid(), name: 'Cartão (exemplo)', limit: 3500, closing: 3, due: 10, color: '#7b5cd6'};
  d.accounts.push(a1, a2, a3); d.cards.push(c1); d.tags.push('casa', 'trabalho');
  d.budgets[C('Alimentação')] = 450; d.budgets[C('Mercado')] = 900; d.budgets[C('Transporte')] = 300; d.budgets[C('Lazer')] = 250;
  d.goals.push({id: uid(), name: 'Viagem de férias (exemplo)', target: 6000, saved: 2100, deadline: dateIn(addYm(ymOf(todayStr()), 8), 1)});
  const ym = ymOf(todayStr()), tday = +todayStr().slice(8);
  const add = (mOff, day, type, desc, amount, catN, src, paid = true, extra = {}) => { const m = addYm(ym, mOff); const date = dateIn(m, day); store.addTx({id: uid(), type, desc, amount, date, cat: catN ? C(catN) : undefined, ...src, paid: paid && (date <= todayStr()), tags: [], created: Date.now(), ...extra}); };
  for (let m = -3; m <= 0; m++) {
    add(m, 5, 'income', 'Salário', 4800, 'Salário', {account: a1.id});
    add(m, 8, 'expense', 'Aluguel', 1400, 'Moradia', {account: a1.id}, true, {fixed: true});
    add(m, 12, 'expense', 'Energia', 160 + m * 7, 'Contas da casa', {account: a1.id}, true, {fixed: true});
    add(m, 15, 'expense', 'Internet', 99.9, 'Contas da casa', {account: a1.id}, true, {fixed: true});
    add(m, 4, 'expense', 'Supermercado', 420 - m * 15, 'Mercado', {card: c1.id});
    add(m, 18, 'expense', 'Supermercado', 310, 'Mercado', {card: c1.id});
    add(m, 9, 'expense', 'iFood', 68.5, 'Alimentação', {card: c1.id});
    add(m, 21, 'expense', 'Restaurante', 112, 'Alimentação', {card: c1.id}, true, {tags: ['trabalho']});
    add(m, 7, 'expense', 'Uber', 34.8, 'Transporte', {card: c1.id});
    add(m, 16, 'expense', 'Posto de combustível', 180, 'Transporte', {account: a1.id});
    add(m, 11, 'expense', 'Streaming', 39.9, 'Assinaturas', {card: c1.id}, true, {fixed: true});
    add(m, 20, 'expense', 'Farmácia', 57.3, 'Saúde', {account: a2.id});
    add(m, 6, 'transfer', 'Guardar na reserva', 400, null, {account: a1.id, to: a3.id});
    if (m < 0) { const inv = invoice(c1.id, addYm(ym, m)); if (inv.total) store.addTx({id: uid(), type: 'cardpay', card: c1.id, invoice: addYm(ym, m), account: a1.id, amount: inv.total, date: inv.dueDate, desc: 'Pagamento fatura ' + c1.name, paid: true, created: Date.now()}); }
  }
  add(0, Math.min(28, tday + 3), 'expense', 'Plano de saúde', 289, 'Saúde', {account: a1.id}, false, {fixed: true});
  add(0, Math.max(1, tday - 2), 'expense', 'Conta de água', 74.2, 'Contas da casa', {account: a1.id}, false);
  add(0, Math.min(28, tday + 6), 'income', 'Freelance site', 900, 'Freelance', {account: a1.id}, false);
  const g = uid(); for (let i = 0; i < 6; i++) add(i - 1, 14, 'expense', 'Fone de ouvido', 66.5, 'Compras', {card: c1.id}, true, {group: g, inst: {n: i + 1, of: 6}});
  Object.keys(store.months).forEach(m => store.saveMonth(m));
}

/* ============ início ============ */
(async function boot() {
  $('#view').innerHTML = '<div class="empty"><b>Carregando suas finanças…</b></div>';
  await store.init();
  try { const [s, dl] = await Promise.all([claude.use('sample'), claude.use('downloads')]); sampleFn = s; downloadsCap = dl; } catch {}
  try { assetsCap = await claude.use('assets'); } catch {}
  if (store.db) store.db.doc('mercado/atual').get().then(d => { if (d.exists) { ui.marketData = d.data(); if (ui.view === 'inicio') render(); } }).catch(() => {});
  if (!store.meta.current) { store.data = blankData(); return onboarding(); }
  if (S().autoPay) { const td = todayStr(); let n = 0; store.allTx().forEach(t => { if (!t.paid && !t.card && !t.noAuto && t.type !== 'transfer' && t.date <= td) { t.paid = true; n++; store.saveMonth(ymOf(t.date)); } }); if (n) setTimeout(() => toast(`${n} lançamento(s) efetivado(s) automaticamente.`), 600); }
  const h = (location.hash || '').slice(1); if (VIEWS[h]) ui.view = h;
  render();
  if (S().lockOnStart && S().pin) pinSheet('unlock');
})();
</script>
