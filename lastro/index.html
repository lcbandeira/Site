<title>Lastro</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&family=Manrope:wght@400;500;600;700&display=swap">
<style>
/* Layout: app de uma coluna estilo celular (máx. 560px), barra superior fixa, navegação inferior e folhas (sheets) para formulários */
:root{
  --bg:#f3f4f7; --surface:#ffffff; --surface2:#eceef3; --line:#dfe2ea;
  --fg:#16192a; --muted:#646a80; --accent:#d9902a; --accent-fg:#1b1406; --accent-soft:#f7e6c9;
  --inc:#13925f; --exp:#d2435a; --trf:#3a7bd5; --card:#7b5cd6; --warn:#c98a00;
  --f-display:"Sora",ui-sans-serif,system-ui,sans-serif; --f-body:"Manrope",ui-sans-serif,system-ui,sans-serif;
  --r:14px; --shadow:0 1px 2px rgba(20,24,40,.06),0 4px 16px rgba(20,24,40,.06);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1017; --surface:#171a24; --surface2:#20242f; --line:#2a2f3c;
  --fg:#e9ebf2; --muted:#9097ab; --accent:#f0aa45; --accent-fg:#1b1406; --accent-soft:#3a2c14;
  --inc:#3ccf8e; --exp:#f06a80; --trf:#6aa4ff; --card:#a58cff; --warn:#f1c24b;
  --shadow:none; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0e1017; --surface:#171a24; --surface2:#20242f; --line:#2a2f3c;
  --fg:#e9ebf2; --muted:#9097ab; --accent:#f0aa45; --accent-fg:#1b1406; --accent-soft:#3a2c14;
  --inc:#3ccf8e; --exp:#f06a80; --trf:#6aa4ff; --card:#a58cff; --warn:#f1c24b;
  --shadow:none; color-scheme:dark }
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.4;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance}
.num{font-variant-numeric:tabular-nums}
.inc{color:var(--inc)}.exp{color:var(--exp)}.trf{color:var(--trf)}.muted{color:var(--muted)}
#app{max-width:560px;margin:0 auto;min-height:100%;display:flex;flex-direction:column}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);
  padding:10px max(16px,env(safe-area-inset-right,0px)) 6px max(16px,env(safe-area-inset-left,0px))}
.toprow{display:flex;align-items:center;gap:8px}
.toprow h1{font-size:1.25rem;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand{display:flex;align-items:center;gap:8px}
.brand svg{flex:none}
.icon-btn{width:40px;height:40px;border-radius:12px;border:0;background:transparent;display:grid;place-items:center;cursor:pointer;color:var(--fg)}
.icon-btn:hover{background:var(--surface2)}
.icon-btn svg{width:22px;height:22px}
.icon-btn.tool{width:34px;height:34px;color:var(--muted)}.icon-btn.tool svg{width:18px;height:18px}
.legend .clickable:hover,.clickable:hover{opacity:.85}
.monthnav{display:flex;align-items:center;justify-content:center;gap:4px;margin-top:4px}
.monthnav span{min-width:150px;text-align:center;font-weight:700}
main{flex:1;padding:6px max(16px,env(safe-area-inset-right,0px)) 110px max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;box-shadow:var(--shadow);min-width:0}
.panel>h2,.ph{font-size:.95rem;display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
.ph h2{font-size:.95rem}
.lbl{font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:700}
.hero{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.hero .big{grid-column:1/-1}
.stat{display:flex;flex-direction:column;gap:2px}
.stat b{font-size:1.15rem;font-family:var(--f-display);font-weight:600}
.hero .big b{font-size:1.9rem}
.row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);min-width:0}
.row:last-child{border-bottom:0}
.row .grow{flex:1;min-width:0}
.row .t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .s{font-size:.8rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .v{text-align:right;font-weight:700;white-space:nowrap}
.row .v small{display:block;font-weight:500;font-size:.75rem;color:var(--muted)}
.clickable{cursor:pointer}
.av{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;flex:none;color:#fff;font-weight:700;font-size:.85rem}
.st{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;flex:none;border:2px solid var(--line);background:transparent;cursor:pointer;padding:0}
.st.ok{background:var(--inc);border-color:var(--inc);color:#fff}
.st.late{border-color:var(--exp);color:var(--exp)}
.st svg{width:16px;height:16px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:3px}
.chip{font-size:.72rem;padding:2px 8px;border-radius:999px;background:var(--surface2);color:var(--fg);font-weight:600}
.seg{display:flex;background:var(--surface2);border-radius:12px;padding:3px;gap:3px;overflow-x:auto}
.seg button{flex:1;border:0;background:transparent;padding:8px 10px;border-radius:9px;cursor:pointer;font-weight:600;white-space:nowrap;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--fg);box-shadow:var(--shadow)}
.bar{height:8px;border-radius:5px;background:var(--surface2);overflow:hidden}
.bar i{display:block;height:100%;border-radius:5px;background:var(--accent)}
.btn{border:0;border-radius:12px;padding:11px 16px;font-weight:700;cursor:pointer;background:var(--accent);color:var(--accent-fg)}
.btn.ghost{background:var(--surface2);color:var(--fg)}
.btn.danger{background:transparent;color:var(--exp);border:1px solid var(--exp)}
.btn.sm{padding:7px 12px;font-size:.85rem;border-radius:10px}
.btn:disabled{opacity:.5;cursor:default}
.btnrow{display:flex;gap:8px;flex-wrap:wrap}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
nav.bottom{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);
  padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
nav.bottom .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);align-items:center}
nav.bottom button{border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.7rem;font-weight:600;color:var(--muted);cursor:pointer;padding:4px 0}
nav.bottom button.on{color:var(--fg)}
nav.bottom button svg{width:22px;height:22px}
nav.bottom .fab{width:52px;height:52px;border-radius:16px;background:var(--accent);color:var(--accent-fg);margin:-22px auto 0;justify-content:center;box-shadow:0 6px 18px rgba(0,0,0,.25)}
nav.bottom .fab svg{width:26px;height:26px}
.sheet-bg{position:fixed;inset:0;background:rgba(5,8,15,.55);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:560px;max-height:92%;overflow:auto;border-radius:20px 20px 0 0;
  padding:16px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:12px}
.sheet h2{font-size:1.1rem}
.sheet .hd{display:flex;align-items:center;justify-content:space-between;gap:8px}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field>span{font-size:.78rem;color:var(--muted);font-weight:600}
.field input,.field select,.field textarea{background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:10px;width:100%;min-width:0}
.field textarea{min-height:90px;resize:vertical}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid2>*{min-width:0}.mini .stat b{font-size:.92rem}.stat b{overflow-wrap:anywhere}
.check{display:flex;align-items:center;gap:10px;justify-content:space-between;padding:6px 0}
.check small{display:block;color:var(--muted)}
.switch{appearance:none;width:44px;height:26px;border-radius:999px;background:var(--line);position:relative;cursor:pointer;flex:none;transition:background .15s}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:left .15s}
.switch:checked{background:var(--accent)}.switch:checked::after{left:21px}
.empty{text-align:center;color:var(--muted);padding:22px 8px}
.empty b{display:block;color:var(--fg);font-family:var(--f-display);margin-bottom:4px}
.daysep{font-size:.78rem;font-weight:700;color:var(--muted);padding:12px 0 2px;display:flex;justify-content:space-between}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(90px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:12px;z-index:60;font-weight:600;display:flex;gap:12px;align-items:center;max-width:calc(100% - 32px)}
.toast button{background:transparent;border:0;color:var(--accent);font-weight:700;cursor:pointer}
.menu-list .row{padding:13px 0}
.legend{display:flex;flex-direction:column;gap:6px;min-width:0;flex:1}
.legend div{display:flex;align-items:center;gap:8px;font-size:.85rem;min-width:0}
.legend i{width:10px;height:10px;border-radius:3px;flex:none}
.legend span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.donutwrap{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
svg text{fill:var(--muted);font-family:var(--f-body)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.cal .h{font-size:.72rem;color:var(--muted);font-weight:700;padding:4px 0}
.cal button{border:0;background:transparent;border-radius:10px;padding:6px 0 4px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;min-height:46px}
.cal button.today{outline:1px solid var(--accent)}
.cal button.sel{background:var(--surface2)}
.dots{display:flex;gap:2px}.dots i{width:5px;height:5px;border-radius:50%}
.chat{display:flex;flex-direction:column;gap:10px}
.msg{max-width:88%;padding:10px 12px;border-radius:14px;white-space:pre-wrap;overflow-wrap:anywhere}
.msg.me{align-self:flex-end;background:var(--accent-soft)}
.msg.ai{align-self:flex-start;background:var(--surface2)}
.msg.tool{align-self:flex-start;font-size:.78rem;color:var(--muted);background:transparent;padding:0 4px}
.chatbar{display:flex;gap:8px;position:sticky;bottom:0;background:var(--surface);padding-top:8px}
.chatbar textarea{flex:1;min-height:44px;max-height:120px;background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:10px;resize:none}
.sugs{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.sugs button{text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px;cursor:pointer;font-weight:600;font-size:.85rem}
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.82rem}
td,th{padding:6px 6px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
.gauge{display:flex;gap:16px;align-items:center}
.lock{position:fixed;inset:0;background:var(--bg);z-index:80;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:24px}
.pinpad{display:grid;grid-template-columns:repeat(3,64px);gap:10px}
.pinpad button{height:56px;border-radius:14px;border:1px solid var(--line);background:var(--surface);font-size:1.2rem;font-weight:700;cursor:pointer}
.pindots{display:flex;gap:12px}.pindots i{width:14px;height:14px;border-radius:50%;border:2px solid var(--muted)}.pindots i.f{background:var(--fg);border-color:var(--fg)}
.notice{font-size:.82rem;padding:10px 12px;border-radius:12px;background:var(--accent-soft)}
.cardart{border-radius:14px;padding:14px;color:#fff;display:flex;flex-direction:column;gap:12px}
.kv{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;font-size:.8rem}
.kv b{display:block;font-size:.92rem}
@media (max-width:380px){.hero .big b{font-size:1.6rem}.sugs{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

  <header class="top">
    <div class="toprow">
      <button class="icon-btn" data-act="go" data-v="mais" aria-label="Menu"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>

</div></nav>

<script>
/* ============ utilidades ============ */
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const BRL = new Intl.NumberFormat('pt-BR', {style: 'currency', currency: 'BRL'});
const round2 = v => Math.round(v * 100) / 100;
const pad = n => String(n).padStart(2, '0');
const todayStr = () => { const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; };
const ymOf = d => d.slice(0, 7);
const addYm = (ym, n) => { let [y, m] = ym.split('-').map(Number); m += n; y += Math.floor((m - 1) / 12); m = ((m - 1) % 12 + 12) % 12 + 1; return `${y}-${pad(m)}`; };
const daysIn = ym => { const [y, m] = ym.split('-').map(Number); return new Date(y, m, 0).getDate(); };
const dateIn = (ym, day) => `${ym}-${pad(Math.min(day, daysIn(ym)))}`;
const MESES = ['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
const MES3 = ['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
const DSEM = ['dom','seg','ter','qua','qui','sex','sáb'];
const ymLabel = ym => { const [y, m] = ym.split('-').map(Number); return MESES[m-1][0].toUpperCase() + MESES[m-1].slice(1) + ' ' + y; };
const brDate = d => d.split('-').reverse().join('/');
const dow = d => DSEM[new Date(d + 'T12:00').getDay()];
const norm = s => String(s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/\d+\/\d+/g, '').replace(/[^a-z ]/g, ' ').replace(/\s+/g, ' ').trim();
const parseMoney = s => { if (typeof s === 'number') return s; s = String(s).replace(/[^\d,.\-]/g, ''); if (s.includes(',')) s = s.replace(/\./g, '').replace(',', '.'); return parseFloat(s) || 0; };
const PALETTE = ['#e0794a','#3a9ad9','#13a37a','#c25bc7','#e2b23a','#5d6fe0','#d24b6a','#2bb3b1','#8a9a3a','#9b6b4a','#6b7d99','#e05f9a'];
const ICO = {
  check: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M5 12l5 5 9-10"/></svg>',
  clock: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><circle cx="12" cy="12" r="8"/><path d="M12 8v4l3 2"/></svg>',
  warn: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 7v6M12 17h.01"/></svg>',
  eye: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>',
  eyeoff: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 3l18 18M10.6 5.1A10 10 0 0 1 12 5c6 0 10 7 10 7a17 17 0 0 1-3.2 3.9M6.6 6.6A17 17 0 0 0 2 12s4 7 10 7a9.6 9.6 0 0 0 5.4-1.6"/></svg>',
  close: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>',
  back: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M15 6l-6 6 6 6"/></svg>',
  open: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></svg>',
  dots: '<svg viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="5" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="12" cy="19" r="1.8"/></svg>',
  chev: '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 6l6 6-6 6"/></svg>'
};

/* ============ modelo de dados ============ */
const DEFAULT_CATS = () => [
  ...[['Alimentação','#e0794a'],['Mercado','#13a37a'],['Moradia','#6b7d99'],['Contas da casa','#3a9ad9'],['Transporte','#e2b23a'],['Saúde','#d24b6a'],['Educação','#5d6fe0'],['Lazer','#c25bc7'],['Compras','#e05f9a'],['Beleza e higiene','#2bb3b1'],['Assinaturas','#8a9a3a'],['Impostos e taxas','#9b6b4a'],['Pets','#b07a3a'],['Presentes e doações','#7a5bd6'],['Outros','#7d8496']].map(([name, color]) => ({id: uid(), type: 'expense', name, color})),
  ...[['Salário','#13a37a'],['Freelance','#3a9ad9'],['Vendas','#e2b23a'],['Rendimentos','#5d6fe0'],['Benefícios','#2bb3b1'],['Reembolso','#c25bc7'],['Outros','#7d8496']].map(([name, color]) => ({id: uid(), type: 'income', name, color}))
];
const KEYWORDS = {
  'Mercado': ['mercado','supermerc','atacad','assai','carrefour','hortifruti','padaria'],
  'Alimentação': ['ifood','restaurante','lanche','pizza','burger','cafe','rappi','bar '],

/* ============ armazenamento ============
   Banco privado de cada pessoa no claude.ai (db: data/users/<id>/...).
   Fora do claude.ai, cai no armazenamento do navegador. */
const store = {
  mode: 'local', col: null,
  meta: {profiles: [], current: null},
  data: null,   // dados do perfil atual (sem transações)
  months: {},   // 'YYYY-MM' -> [transações]
  timers: {},
  async init() {
    let db = null, user = null;
    try { if (window.claude?.use) [db, user] = await Promise.all([claude.use('db'), claude.use('user')]); } catch {}
    let id = null;
    try { id = user ? await user.id() : null; } catch {}
    if (db && id) {
      this.mode = 'cloud';
      this.col = db.collection('data/users/' + id); this.db = db;
      const loaded = await Promise.race([this.col.get(), new Promise((_, rej) => setTimeout(() => rej(new Error('timeout')), 12000))]).catch(() => null);
      if (loaded) { const all = {}; loaded.docs.forEach(d => { if (d.exists) all[d.id] = d.data(); }); this.raw = all; }
      else { this.mode = 'local'; this.col = null; }
    }
    if (this.mode === 'local') {
      this.raw = {};
      try { const s = localStorage.getItem('lastro-all'); if (s) this.raw = JSON.parse(s); } catch {}
    }
    this.meta = this.raw.meta ? structuredClone(this.raw.meta) : {profiles: [], current: null};
    if (this.meta.current) this.openProfile(this.meta.current);
  },
  openProfile(pid) {
    this.meta.current = pid;
    const d = this.raw['p_' + pid];
    this.data = d ? Object.assign(blankData(), structuredClone(d)) : blankData();
    this.data.settings = Object.assign(blankData().settings, this.data.settings);
    this.months = {};
    const pre = 'p_' + pid + '_m_';
    Object.keys(this.raw).forEach(k => { if (k.startsWith(pre)) this.months[k.slice(pre.length)] = structuredClone(this.raw[k].tx || []); });
  },
  docSet(key, body) {
    this.raw[key] = body;
    clearTimeout(this.timers[key]);
    this.timers[key] = setTimeout(() => this.flush(key), 350);
  },
  async flush(key) {
    const body = this.raw[key];
    if (this.mode === 'cloud') {
      try { body === null ? await this.col.doc(key).delete() : await this.col.doc(key).set(body); }
      catch (e) { toast(e?.code === 'quota_exceeded' ? 'O armazenamento está cheio. Apague pontos de restauração antigos.' : 'Não foi possível salvar. Verifique a conexão.'); }
    } else {
      try { const copy = {}; Object.entries(this.raw).forEach(([k, v]) => { if (v !== null) copy[k] = v; }); localStorage.setItem('lastro-all', JSON.stringify(copy)); } catch {}
    }
    if (body === null) delete this.raw[key];
  },
  saveMeta() { this.docSet('meta', structuredClone(this.meta)); },
  saveData() { this.docSet('p_' + this.meta.current, structuredClone(this.data)); },
  saveMonth(ym) { this.docSet('p_' + this.meta.current + '_m_' + ym, {tx: structuredClone(this.months[ym] || [])}); },
  allTx() { return Object.values(this.months).flat(); },
  findTx(id) { for (const [ym, arr] of Object.entries(this.months)) { const t = arr.find(x => x.id === id); if (t) return t; } return null; },
  addTx(t) { const ym = ymOf(t.date); (this.months[ym] ||= []).push(t); this.saveMonth(ym); },
  removeTx(id) { for (const [ym, arr] of Object.entries(this.months)) { const i = arr.findIndex(x => x.id === id); if (i >= 0) { arr.splice(i, 1); this.saveMonth(ym); return; } } },
  updateTx(t) { this.removeTx(t.id); this.addTx(t); },
  snapshot(label) {
    const snap = {id: uid(), at: new Date().toISOString(), label, data: structuredClone({...this.data, snaps: []}), months: structuredClone(this.months)};
    const key = 'p_' + this.meta.current + '_snap_' + snap.id;
    this.docSet(key, snap);
    this.data.snaps = [{id: snap.id, at: snap.at, label, key}, ...this.data.snaps];
    while (this.data.snaps.length > 6) { const old = this.data.snaps.pop(); this.docSet(old.key, null); }
    this.saveData();
  },
  restore(snapMeta) {
    const s = this.raw[snapMeta.key]; if (!s) return false;
    const keep = this.data.snaps;
    Object.keys(this.months).forEach(ym => { this.months[ym] = []; this.saveMonth(ym); });
    this.data = Object.assign(blankData(), structuredClone(s.data)); this.data.snaps = keep;
    this.months = structuredClone(s.months); Object.keys(this.months).forEach(ym => this.saveMonth(ym));
    this.saveData(); return true;
  }
};

const money = (v, sign) => S().hide ? 'R$ •••' : (sign && v > 0 ? '+' : '') + BRL.format(v);
const cat = id => D().cats.find(c => c.id === id) || {name: 'Sem categoria', color: '#7d8496'};
const acc = id => D().accounts.find(a => a.id === id);

const sourceName = t => t.card ? (card(t.card)?.name || 'Cartão') : (acc(t.account)?.name || 'Conta');

/* ============ cálculos ============ */
function cardInvoiceYm(c, date) {
  let ym = ymOf(date); const day = +date.slice(8);
  if (day > c.closing) ym = addYm(ym, 1);
  if (c.due <= c.closing) ym = addYm(ym, 1);
  return ym;
}
function accountBalance(aid, uptoDate, onlyPaid) {
  const a = acc(aid); let b = a?.initial || 0;
  for (const t of store.allTx()) {
    const eff = t.paid && t.paidDate ? t.paidDate : t.date;
    if (eff > uptoDate || (onlyPaid && !t.paid)) continue;
    if (t.type === 'income' && t.account === aid) b += t.amount;
    else if (t.type === 'expense' && !t.card && t.account === aid) b -= t.amount;
    else if (t.type === 'transfer') { if (t.account === aid) b -= t.amount; if (t.to === aid) b += t.amount; }
    else if (t.type === 'cardpay' && t.account === aid) b -= t.amount;
  }
  return round2(b);
}
const endOf = ym => dateIn(ym, 31);
function totalBalance(ym, onlyPaid) {
  return round2(D().accounts.filter(a => !a.archived && a.inTotal !== false).reduce((s, a) => s + accountBalance(a.id, onlyPaid && ym === ymOf(todayStr()) ? todayStr() : endOf(ym), onlyPaid), 0));
}
function monthTx(ym) { return store.months[ym] || []; }
function monthTotals(ym) {
  let inc = 0, exp = 0, incP = 0, expP = 0, cardExp = 0, debExp = 0, pendN = 0, pendV = 0;
  for (const t of monthTx(ym)) {
    if (t.ign?.totals) continue;
    if (t.type === 'income') { inc += t.amount; if (t.paid) incP += t.amount; }
    if (t.type === 'expense') { exp += t.amount; if (t.paid || t.card) expP += t.amount; t.card ? cardExp += t.amount : debExp += t.amount; if (!t.paid && !t.card) { pendN++; pendV += t.amount; } }
  }
  return {inc: round2(inc), exp: round2(exp), incP: round2(incP), expP: round2(expP), cardExp: round2(cardExp), debExp: round2(debExp), pendN, pendV: round2(pendV)};
}
function invoice(cid, ym) {
  const c = card(cid); let total = 0; const items = [];
  for (const t of store.allTx()) if (t.type === 'expense' && t.card === cid && cardInvoiceYm(c, t.date) === ym) { total += t.amount; items.push(t); }
  const paid = store.allTx().filter(t => t.type === 'cardpay' && t.card === cid && t.invoice === ym).reduce((s, t) => s + t.amount, 0);
  let used = 0;
  for (const t of store.allTx()) if (t.type === 'expense' && t.card === cid && cardInvoiceYm(c, t.date) >= ymOf(todayStr())) used += t.amount;
  const paidOpen = store.allTx().filter(t => t.type === 'cardpay' && t.card === cid && t.invoice >= ymOf(todayStr())).reduce((s, t) => s + t.amount, 0);
  return {total: round2(total), paid: round2(paid), items, used: round2(used - paidOpen), closeDate: dateIn(c.due <= c.closing ? addYm(ym, -1) : ym, c.closing), dueDate: dateIn(ym, c.due)};
}
function byCategory(ym, type, flag = 'stats') {
  const m = {};
  for (const t of monthTx(ym)) if (t.type === type && !t.ign?.[flag]) m[t.cat] = (m[t.cat] || 0) + t.amount;
  return Object.entries(m).map(([id, v]) => ({id, v: round2(v), c: cat(id), f: fAttr({tab: type, cat: id})})).sort((a, b) => b.v - a.v);
}
const fAttr = o => 'data-act="filter" ' + Object.entries(o).map(([k, v]) => `data-f${k}="${esc(v)}"`).join(' ');
function savingTotals(ym) {
  let inc = 0, exp = 0;
  for (const t of monthTx(ym)) { if (t.ign?.saving) continue; if (t.type === 'income') inc += t.amount; if (t.type === 'expense') exp += t.amount; }
  return {inc, exp};
}
function statusOf(t) {
  if (t.type === 'cardpay' || t.card) return 'ok';
  if (t.paid) return 'ok';
  return t.date < todayStr() ? 'late' : 'pend';
}
function health(ym) {
  const mt = monthTotals(ym);
  const prev = [1, 2, 3].map(i => monthTotals(addYm(ym, -i)));
  const avgExp = (mt.exp + prev.reduce((s, p) => s + p.exp, 0)) / 4 || 1;
  const savingAcc = D().accounts.filter(a => a.kind === 'savings' || a.kind === 'invest').reduce((s, a) => s + accountBalance(a.id, endOf(ym), false), 0);
  const parts = [];
  const sv = savingTotals(ym); const rate = sv.inc ? (sv.inc - sv.exp) / sv.inc : (sv.exp ? -1 : 0);
  parts.push({k: 'Economia', s: Math.max(0, Math.min(25, rate * 125)), max: 25, hint: sv.inc ? `Você guardou ${Math.round(rate * 100)}% do que entrou.` : 'Nenhuma receita no mês.'});
  const months = savingAcc / avgExp;
  parts.push({k: 'Reserva', s: Math.max(0, Math.min(25, months / 6 * 25)), max: 25, hint: `Sua reserva cobre ${months.toFixed(1).replace('.', ',')} mês(es) de gastos. O ideal é 6.`});
  const buds = Object.entries(D().budgets).filter(([, v]) => v > 0);
  const byC = Object.fromEntries(byCategory(ym, 'expense', 'budget').map(x => [x.id, x.v]));
  const okB = buds.filter(([c, v]) => (byC[c] || 0) <= v).length;
  parts.push({k: 'Planejamento', s: buds.length ? okB / buds.length * 20 : 8, max: 20, hint: buds.length ? `${okB} de ${buds.length} orçamentos dentro do limite.` : 'Defina orçamentos por categoria.'});
  const cardShare = mt.inc ? mt.cardExp / mt.inc : (mt.cardExp ? 1 : 0);
  parts.push({k: 'Crédito', s: Math.max(0, 15 - Math.max(0, cardShare - .3) * 30), max: 15, hint: `Cartões levam ${Math.round(cardShare * 100)}% da sua renda do mês.`});
  const late = store.allTx().filter(t => statusOf(t) === 'late').length;
  parts.push({k: 'Compromissos', s: Math.max(0, 15 - late * 3), max: 15, hint: late ? `${late} conta(s) vencida(s) sem pagamento.` : 'Nenhuma conta vencida.'});
  return {score: Math.round(parts.reduce((s, p) => s + p.s, 0)), parts};
}

/* ============ gráficos (SVG) ============ */
function donut(items, total, label, center = total) {
  const R = 52, C = 2 * Math.PI * R; let off = 0;
  const segs = total > 0 ? items.map(it => { const len = it.v / total * C; const s = `<circle r="${R}" cx="70" cy="70" fill="none" stroke="${it.c.color}" stroke-width="20" stroke-dasharray="${len} ${C - len}" stroke-dashoffset="${-off}" transform="rotate(-90 70 70)" ${it.f ? it.f + ' style="cursor:pointer"' : ''}><title>${esc(it.c.name || '')}</title></circle>`; off += len; return s; }).join('') : `<circle r="${R}" cx="70" cy="70" fill="none" stroke="var(--surface2)" stroke-width="20"/>`;
  return `<svg viewBox="0 0 140 140" width="140" height="140" role="img" aria-label="${esc(label)}">${segs}
    <text x="70" y="66" text-anchor="middle" font-size="10">${esc(label)}</text>
    <text x="70" y="82" text-anchor="middle" font-size="12" font-weight="700" style="fill:var(--fg)">${S().hide ? '•••' : BRL.format(center).replace('R$ ', 'R$ ')}</text></svg>`;
}
function barsChart(series, colors, labels) {
  const W = 320, H = 150, pb = 22, pl = 6;
  const max = Math.max(1, ...series.flat());
  const n = labels.length, gw = (W - pl) / n, bw = Math.min(16, (gw - 8) / series.length);
  let out = `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Gráfico de barras">`;
  [0.5, 1].forEach(f => { const y = (H - pb) * (1 - f) + 4; out += `<line x1="0" x2="${W}" y1="${y}" y2="${y}" stroke="var(--line)" stroke-dasharray="3 3"/>`; });
  labels.forEach((lb, i) => {
    series.forEach((s, j) => { const h = (s[i] / max) * (H - pb - 8); const x = pl + i * gw + (gw - bw * series.length) / 2 + j * bw; out += `<rect x="${x}" y="${H - pb - h}" width="${bw - 2}" height="${Math.max(h, 0)}" rx="3" fill="${colors[j]}"/>`; });
    out += `<text x="${pl + i * gw + gw / 2}" y="${H - 6}" text-anchor="middle" font-size="10">${lb}</text>`;
  });
  return out + '</svg>';
}
function lineChart(points, color, labelsEvery) {
  const W = 320, H = 140, pb = 20; if (!points.length) return '';
  const max = Math.max(...points), min = Math.min(0, ...points), span = max - min || 1;
  const x = i => 6 + i * (W - 12) / Math.max(1, points.length - 1), y = v => 6 + (H - pb - 12) * (1 - (v - min) / span);
  const d = points.map((v, i) => `${i ? 'L' : 'M'}${x(i).toFixed(1)},${y(v).toFixed(1)}`).join('');
  let out = `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Evolução"><path d="${d}L${x(points.length - 1)},${H - pb}L${x(0)},${H - pb}Z" fill="${color}" opacity=".15"/><path d="${d}" fill="none" stroke="${color}" stroke-width="2.2"/>`;
  out += `<circle cx="${x(points.length - 1)}" cy="${y(points[points.length - 1])}" r="4" fill="${color}"/>`;
  points.forEach((_, i) => { if ((i + 1) % labelsEvery === 0 || i === 0) out += `<text x="${x(i)}" y="${H - 5}" text-anchor="middle" font-size="10">${i + 1}</text>`; });
  return out + '</svg>';
}
function gauge(score) {
  const R = 40, C = Math.PI * R, len = score / 100 * C;
  const col = score >= 70 ? 'var(--inc)' : score >= 45 ? 'var(--warn)' : 'var(--exp)';
  return `<svg viewBox="0 0 100 60" width="120" role="img" aria-label="Nota ${score} de 100"><path d="M10 52a40 40 0 0 1 80 0" fill="none" stroke="var(--surface2)" stroke-width="10" stroke-linecap="round"/>
  <path d="M10 52a40 40 0 0 1 80 0" fill="none" stroke="${col}" stroke-width="10" stroke-linecap="round" stroke-dasharray="${len} ${C}"/>
  <text x="50" y="50" text-anchor="middle" font-size="18" font-weight="700" style="fill:var(--fg)">${score}</text></svg>`;
}

  const F = r.f || {}; if (F.cat) l = l.filter(t => t.cat === F.cat); if (F.card) l = l.filter(t => t.card === F.card); if (F.st) l = l.filter(t => stKey(t) === F.st); if (F.rec) l = l.filter(t => (t.inst ? 'parcelada' : t.fixed ? 'fixa' : 'variavel') === F.rec); if (F.pay) l = l.filter(t => F.pay === 'credit' ? !!t.card : t.type === 'expense' && !t.card);
  return round2(l.reduce((s, t) => s + (t.type === 'income' ? t.amount : t.type === 'expense' ? -t.amount : 0), 0));
}

    <div class="grow"><div class="t">${HOME_NAME[h.id]}</div></div><input type="checkbox" class="switch" data-home="${h.id}" ${h.on ? 'checked' : ''} aria-label="Mostrar ${HOME_NAME[h.id]}"></div>`).join('')}</section>

};
VIEWS.busca = () => {

  <section class="panel"><div class="ph"><span class="lbl">${l.length} resultado(s) em todos os meses</span><b class="num ${sum >= 0 ? 'inc' : 'exp'}">${money(sum, true)}</b></div>${l.slice(0, 200).map(t => txRow(t)).join('') || emptyBox(q ? 'Nada encontrado' : 'Pesquise seus lançamentos', q ? 'Tente outra palavra.' : 'A busca olha todos os meses de uma vez.')}</section>`;
};

const stKey = t => { const st = statusOf(t); return st === 'ok' ? 'ok' : st === 'late' ? 'late' : t.date <= shiftDate(todayStr(), 7) ? 'soon' : 'far'; };
const fLabel = (k, v) => k === 'cat' ? cat(v).name : k === 'card' ? 'Cartão ' + (card(v)?.name || '') : k === 'st' ? {ok: 'Efetivadas', soon: 'Vencem em até 7 dias', late: 'Vencidas', far: 'Vencem depois'}[v] : k === 'rec' ? {fixa: 'Fixas', parcelada: 'Parceladas', variavel: 'Variáveis'}[v] : k === 'pay' ? (v === 'credit' ? 'No crédito' : 'No débito') : v;
VIEWS.lanc = () => {
  const tabs = [['all', 'Todos'], ['expense', 'Despesas'], ['income', 'Receitas'], ['transfer', 'Transferências'], ['pend', 'Pendentes']];
  let list = monthTx(ui.ym).slice();
  if (ui.lancTab === 'pend') list = list.filter(t => statusOf(t) !== 'ok');
  else if (ui.lancTab === 'transfer') list = list.filter(t => t.type === 'transfer' || t.type === 'cardpay');
  else if (ui.lancTab !== 'all') list = list.filter(t => t.type === ui.lancTab);
  if (ui.search) { const q = norm(ui.search); list = list.filter(t => norm(t.desc + ' ' + cat(t.cat).name + ' ' + subName(t) + ' ' + (t.tags || []).join(' ')).includes(q)); }
  const F = ui.f || {};
  if (F.cat) list = list.filter(t => t.cat === F.cat);
  if (F.card) list = list.filter(t => t.card === F.card);
  if (F.st) list = list.filter(t => stKey(t) === F.st);
  if (F.rec) list = list.filter(t => (t.inst ? 'parcelada' : t.fixed ? 'fixa' : 'variavel') === F.rec);
  if (F.pay) list = list.filter(t => F.pay === 'credit' ? !!t.card : t.type === 'expense' && !t.card);
  const chipsF = Object.entries(F).filter(([, v]) => v).map(([k, v]) => `<button class="chip" style="border:0;cursor:pointer;padding:6px 10px" data-act="clearF" data-v="${k}" aria-label="Remover filtro">${esc(fLabel(k, v))} ✕</button>`).join('');
  list.sort((a, b) => b.date.localeCompare(a.date) || (b.created || 0) - (a.created || 0));
  const sum = list.reduce((s, t) => s + (t.type === 'income' ? t.amount : t.type === 'expense' ? -t.amount : 0), 0);
  let lastDay = '', html = '';
  for (const t of list) { if (t.date !== lastDay) { lastDay = t.date; html += `<div class="daysep"><span>${dow(t.date)}, ${brDate(t.date)}</span></div>`; } html += txRow(t); }
  return `<div class="seg" role="tablist">${tabs.map(([k, l]) => `<button class="${ui.lancTab === k ? 'on' : ''}" data-act="lancTab" data-v="${k}">${l}</button>`).join('')}</div>
  <div class="field"><input id="searchBox" type="search" placeholder="Buscar por descrição, categoria ou tag" value="${esc(ui.search)}" aria-label="Buscar"></div>
  ${chipsF ? `<div class="chips" style="align-items:center"><span class="lbl">Filtros:</span>${chipsF}<button class="chip" style="border:0;cursor:pointer;padding:6px 10px;background:transparent;color:var(--accent)" data-act="clearF" data-v="*">Limpar</button></div>` : ''}
  ${ui.search || ui.lancTab !== 'all' || chipsF ? '<button class="btn ghost sm" style="align-self:flex-start" data-act="saveReport">Salvar como relatório</button>' : ''}
  <section class="panel"><div class="ph"><span class="lbl">${list.length} lançamento(s)</span><b class="num ${sum >= 0 ? 'inc' : 'exp'}">${money(sum, true)}</b></div>
  ${html || emptyBox('Nada por aqui', 'Toque no botão + para lançar uma despesa, receita ou transferência.')}</section>`;
};

VIEWS.extrato = () => {
  const aid = ui.acc || D().accounts[0]?.id;
  if (!aid) return `<section class="panel">${emptyBox('Sem contas', 'Cadastre uma conta para ver o extrato.', '<button class="btn sm" data-act="accForm">Adicionar conta</button>')}</section>`;
  const start = accountBalance(aid, addYm(ui.ym, -1) + '-31', false);
  const list = monthTx(ui.ym).filter(t => (t.account === aid && !t.card) || t.to === aid).sort((a, b) => a.date.localeCompare(b.date));
  let bal = start, html = '', day = '';
  const dayRows = {};
  list.forEach(t => (dayRows[t.date] ||= []).push(t));
  for (const [d, ts] of Object.entries(dayRows)) {
    let inn = 0, out = 0;
    ts.forEach(t => { const v = (t.type === 'income' || (t.type === 'transfer' && t.to === aid)) ? t.amount : -t.amount; v > 0 ? inn += v : out += v; });
    bal += inn + out;
    html += `<div class="daysep"><span>${dow(d)}, ${brDate(d)}</span><span class="num">Saldo ${money(round2(bal))}</span></div>` + ts.map(txRow).join('');
  }
  return `<div class="field"><span>Conta</span><select id="extratoAcc">${D().accounts.map(a => `<option value="${a.id}" ${a.id === aid ? 'selected' : ''}>${esc(a.name)}</option>`).join('')}</select></div>
  <section class="panel hero"><div class="stat"><span class="lbl">Saldo inicial do mês</span><b class="num">${money(start)}</b></div><div class="stat"><span class="lbl">Saldo final previsto</span><b class="num">${money(round2(bal))}</b></div></section>
  <section class="panel">${html || emptyBox('Sem movimentações', 'Nenhum lançamento nesta conta neste mês.')}</section>`;

VIEWS.cartoes = () => {

        <div><span style="opacity:.8;font-size:.78rem">Fatura de ${ymLabel(ui.ym).toLowerCase()}</span><div style="font-size:1.6rem;font-family:var(--f-display)" class="num">${money(inv.total)}</div></div></div>
      <div class="kv"><div><span class="muted">Fecha</span><b>${brDate(inv.closeDate).slice(0, 5)}</b></div><div><span class="muted">Vence</span><b>${brDate(inv.dueDate).slice(0, 5)}</b></div><div><span class="muted">Limite livre</span><b class="num">${money(c.limit - inv.used)}</b></div></div>
      <div class="bar"><i style="width:${usedP * 100}%;background:var(--card)"></i></div>
      ${inv.items.length ? `<details><summary class="clickable" style="font-weight:600">${inv.items.length} compra(s) nesta fatura</summary>${inv.items.sort((a, b) => b.date.localeCompare(a.date)).map(txRow).join('')}</details>` : ''}
      <div class="btnrow">${open > 0 ? `<button class="btn sm" data-act="payInvoice" data-v="${c.id}">Pagar fatura (${money(open)})</button>` : ''}<button class="btn ghost sm" data-act="cardForm" data-v="${c.id}">Editar cartão</button></div>

VIEWS.contas = () => `<section class="panel">${D().accounts.length ? D().accounts.map(a => `<div class="row clickable" data-act="accForm" data-v="${a.id}">${avatar(a.name, a.color)}<div class="grow"><div class="t">${esc(a.name)}${a.archived ? ' (arquivada)' : ''}</div><div class="s">${KIND[a.kind]}${a.inTotal === false ? ' · fora do saldo geral' : ''}</div></div><div class="v num">${money(accountBalance(a.id, todayStr(), true))}</div></div>`).join('') : emptyBox('Nenhuma conta', 'Adicione sua primeira conta.')}</section>
  <button class="btn" data-act="accForm">Adicionar conta</button>`;

VIEWS.planejar = () => {
  const tabs = `<div class="seg"><button class="${ui.planTab === 'budgets' ? 'on' : ''}" data-act="planTab" data-v="budgets">Orçamentos</button><button class="${ui.planTab === 'goals' ? 'on' : ''}" data-act="planTab" data-v="goals">Objetivos</button></div>`;
  if (ui.planTab === 'goals') {
    return tabs + (D().goals.length ? D().goals.map(g => {
      const p = g.target ? Math.min(1, g.saved / g.target) : 0;
      const monthsLeft = g.deadline ? Math.max(1, (new Date(g.deadline + 'T12:00') - new Date()) / (30.4 * 864e5)) : null;
      const ideal = monthsLeft ? Math.max(0, (g.target - g.saved) / Math.ceil(monthsLeft)) : null;
      return `<section class="panel"><div class="ph"><h2>${esc(g.name)}</h2><b class="num">${Math.round(p * 100)}%</b></div>
        <div class="bar" style="height:10px"><i style="width:${p * 100}%;background:var(--inc)"></i></div>
        <div class="kv" style="margin-top:10px"><div><span class="muted">Guardado</span><b class="num">${money(g.saved)}</b></div><div><span class="muted">Objetivo</span><b class="num">${money(g.target)}</b></div><div><span class="muted">Ideal por mês</span><b class="num">${ideal === null ? '—' : money(round2(ideal))}</b></div></div>
        ${g.deadline ? `<p class="muted" style="margin:8px 0 0;font-size:.85rem">Prazo: ${brDate(g.deadline)} · faltam ${money(Math.max(0, g.target - g.saved))}</p>` : ''}
        <div class="btnrow" style="margin-top:10px"><button class="btn sm" data-act="goalDeposit" data-v="${g.id}">Depositar</button><button class="btn ghost sm" data-act="goalForm" data-v="${g.id}">Editar</button></div></section>`;
    }).join('') : `<section class="panel">${emptyBox('Nenhum objetivo', 'Crie metas como reserva de emergência, viagem ou um carro novo.')}</section>`) + `<button class="btn" data-act="goalForm">Novo objetivo</button>`;

  };

};

VIEWS.graficos = () => {
  const ty = ui.chartTab, cats = byCategory(ui.ym, ty), total = cats.reduce((s, x) => s + x.v, 0);

  monthTx(ui.ym).filter(t => t.type === ty).forEach(t => daily[+t.date.slice(8) - 1] += t.amount);
  let acc2 = 0; const cum = daily.map(v => acc2 += v);
  const prevCum = (() => { const p = addYm(ui.ym, -1); const d = Array(days).fill(0); monthTx(p).filter(t => t.type === ty).forEach(t => { const i = Math.min(days, +t.date.slice(8)) - 1; d[i] += t.amount; }); let a = 0; return d.map(v => a += v); })();
  const last6 = [-5, -4, -3, -2, -1, 0].map(i => addYm(ui.ym, i));
  const color = ty === 'expense' ? 'var(--exp)' : 'var(--inc)';
  const rec = {fixa: 0, parcelada: 0, variavel: 0}; monthTx(ui.ym).filter(t => t.type === ty).forEach(t => rec[t.inst ? 'parcelada' : t.fixed ? 'fixa' : 'variavel'] += t.amount);
  return `<div class="seg"><button class="${ty === 'expense' ? 'on' : ''}" data-act="chartTab" data-v="expense">Despesas</button><button class="${ty === 'income' ? 'on' : ''}" data-act="chartTab" data-v="income">Receitas</button></div>
  <section class="panel"><div class="ph"><h2>Por categoria</h2></div>${cats.length ? `<div class="donutwrap">${donut(cats, total, 'Total')}<div class="legend">${cats.map(x => `<div class="clickable" ${x.f}><i style="background:${x.c.color}"></i><span>${esc(x.c.name)}</span><b class="num">${Math.round(x.v / total * 100)}%</b><span class="muted">›</span></div>`).join('')}</div></div>` : emptyBox('Sem dados', 'Nada lançado neste mês.')}</section>
  <section class="panel"><div class="ph"><h2>Ranking</h2></div>${cats.map(x => `<div style="margin-bottom:8px" class="clickable" ${x.f}><div style="display:flex;justify-content:space-between;font-size:.88rem"><span>${esc(x.c.name)}</span><span class="num">${money(x.v)}</span></div><div class="bar"><i style="width:${x.v / (cats[0]?.v || 1) * 100}%;background:${x.c.color}"></i></div></div>`).join('') || '<p class="muted">Sem dados.</p>'}</section>
  <section class="panel"><div class="ph"><h2>Evolução no mês</h2><span class="muted" style="font-size:.78rem">acumulado por dia</span></div>${lineChart(cum, color, 5)}
    <p class="muted" style="font-size:.85rem;margin:6px 0 0">Até agora: ${money(round2(cum[Math.min(days, +todayStr().slice(8)) - 1] || cum[days - 1]))}. Mês passado no mesmo dia: ${money(round2(prevCum[Math.min(days, +todayStr().slice(8)) - 1] || 0))}.</p></section>
  <section class="panel"><div class="ph"><h2>Por recorrência</h2></div><div class="donutwrap">${donut([{v: rec.fixa, c: {color: '#3a9ad9'}}, {v: rec.parcelada, c: {color: '#e2b23a'}}, {v: rec.variavel, c: {color: '#e0794a'}}], rec.fixa + rec.parcelada + rec.variavel, 'Total')}
    <div class="legend"><div><i style="background:#3a9ad9"></i><span>Fixas</span><b class="num">${money(rec.fixa)}</b></div><div><i style="background:#e2b23a"></i><span>Parceladas</span><b class="num">${money(rec.parcelada)}</b></div><div><i style="background:#e0794a"></i><span>Variáveis</span><b class="num">${money(rec.variavel)}</b></div></div></div></section>
  <section class="panel"><div class="ph"><h2>Receitas x despesas</h2></div>${barsChart([last6.map(m => monthTotals(m).inc), last6.map(m => monthTotals(m).exp)], ['var(--inc)', 'var(--exp)'], last6.map(m => MES3[+m.slice(5) - 1]))}</section>
  <section class="panel"><div class="ph"><h2>Projeção do saldo</h2><span class="muted" style="font-size:.78rem">próximos 6 meses</span></div>${barsChart([[0, 1, 2, 3, 4, 5].map(i => Math.max(0, totalBalance(addYm(ui.ym, i), false)))], ['var(--accent)'], [0, 1, 2, 3, 4, 5].map(i => MES3[+addYm(ui.ym, i).slice(5) - 1]))}</section>`;
};

VIEWS.calendario = () => {
  const ym = ui.ym, first = new Date(ym + '-01T12:00').getDay(), n = daysIn(ym);

VIEWS.saude = () => {

let toastTimer;
function toast(msg, undo) {
  document.querySelector('.toast')?.remove();
  const el = document.createElement('div'); el.className = 'toast'; el.setAttribute('role', 'status');
  el.innerHTML = `<span>${esc(msg)}</span>${undo ? '<button>Desfazer</button>' : ''}`;
  if (undo) el.querySelector('button').onclick = () => { undo(); el.remove(); };
  document.body.appendChild(el); clearTimeout(toastTimer); toastTimer = setTimeout(() => el.remove(), 4500);
}
function sheet(html, onMount) {
  const bg = document.createElement('div'); bg.className = 'sheet-bg';
  bg.innerHTML = `<div class="sheet" role="dialog" aria-modal="true">${html}</div>`;
  bg.addEventListener('click', e => { if (e.target === bg || e.target.closest('[data-close]')) bg.remove(); });
  $('#layer').appendChild(bg); onMount?.(bg.firstElementChild, () => bg.remove());
  bg.querySelector('input,select,textarea')?.focus({preventScroll: true});
}

}

/* ============ formulário de lançamento ============ */
function evalAmount(str) {
  let s = String(str ?? '').replace(/R\$|\s/g, '');
  if (!s) return 0;
  if (s.includes(',')) s = s.replace(/\.(?=\d{3}(\D|$))/g, '').replace(/,/g, '.');
  if (!/^[\d.+\-*/()]+$/.test(s)) return parseMoney(str);
  try { const v = Function('"use strict";return (' + s + ')')(); return isFinite(v) ? round2(v) : 0; } catch { return parseMoney(str); }
}
const fmtInput = v => v ? String(round2(v)).replace('.', ',') : '';
const subName = t => { const c = cat(t.cat); return t.sub ? (c.subs || []).find(s => s.id === t.sub)?.name || '' : ''; };
function addPeriod(date, i, freq) {
  if (freq === 'w' || freq === '2w') { const d = new Date(date + 'T12:00'); d.setDate(d.getDate() + i * (freq === 'w' ? 7 : 14)); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; }
  return dateIn(addYm(ymOf(date), i * (freq === 'y' ? 12 : 1)), +date.slice(8));
}
const IGN = [['stats', 'Ignorar em estatísticas e gráficos'], ['budget', 'Ignorar em orçamentos'], ['saving', 'Ignorar na economia mensal'], ['totals', 'Ignorar nos totais do mês']];
let assetsCap = null;

function txForm(t, preset = {}) {
  const editing = !!t;
  if (!D().accounts.length && !D().cards.length) { toast('Cadastre uma conta antes de lançar.'); return accForm(); }
  t = t || {};
  const firstAcc = D().accounts[0]?.id;
  const f = {
    type: t.type === 'cardpay' ? 'transfer' : (t.type || preset.type || 'expense'),
    amountStr: fmtInput(t.adj ? t.amount - (t.adj.kind === 'fee' ? t.adj.v : -t.adj.v) : t.amount), adjKind: t.adj?.kind || 'fee', adjStr: fmtInput(t.adj?.v), launch: t.launch || nowLocal(), desc: t.desc || '', rep: 'no', times: 2, instMode: 'total', freq: 'm', fixedMonths: 12,
    multi: false, splits: [], date: t.date || preset.date || todayStr(), paid: t.paid ?? true, paidDate: t.paidDate || '',
    cat: t.cat || null, sub: t.sub || '', src: t.card ? 'c:' + t.card : 'a:' + (t.account || firstAcc), from: t.account || firstAcc, to: t.to || D().accounts[1]?.id || firstAcc,
    tagsStr: (t.tags || []).join(', '), note: t.note || '', att: structuredClone(t.att || []), goal: t.goal || '', noAuto: !!t.noAuto, ign: {...(t.ign || {})},
    cont: false, more: !!(t.note || t.adj || t.att?.length || t.goal || t.noAuto || Object.values(t.ign || {}).some(Boolean)), applyAll: false
  };
  const catsOf = () => D().cats.filter(c => c.type === (f.type === 'income' ? 'income' : 'expense'));
  const subOpts = (cid, sel) => { const subs = cat(cid).subs || []; return `<option value="">Nenhuma</option>` + subs.map(s => `<option value="${s.id}" ${s.id === sel ? 'selected' : ''}>${esc(s.name)}</option>`).join(''); };
  const tone = () => f.type === 'income' ? 'var(--inc)' : f.type === 'expense' ? 'var(--exp)' : 'var(--trf)';
  let el;

  const collect = () => {
    const q = id => el.querySelector('#' + id);
    const v = id => q(id)?.value, c = id => q(id)?.checked;
    if (q('fAmount')) f.amountStr = v('fAmount');
    if (q('fDesc')) f.desc = v('fDesc');
    if (q('fRep')) f.rep = v('fRep');
    if (q('fTimes')) f.times = +v('fTimes') || 2;
    if (q('fFreq')) f.freq = v('fFreq');
    if (q('fInstMode')) f.instMode = v('fInstMode');
    if (q('fMonths')) f.fixedMonths = +v('fMonths') || 12;
    if (q('fDate')) f.date = v('fDate');
    if (q('fPaid')) f.paid = c('fPaid');
    if (q('fPaidDate')) f.paidDate = v('fPaidDate');
    if (q('fCat')) f.cat = v('fCat');
    if (q('fSub')) f.sub = v('fSub');
    if (q('fSrc')) f.src = v('fSrc');
    if (q('fFrom')) f.from = v('fFrom');
    if (q('fTo')) f.to = v('fTo');
    if (q('fTags')) f.tagsStr = v('fTags');
    if (q('fNote')) f.note = v('fNote');
    if (q('fAdj')) f.adjStr = v('fAdj');
    if (q('fLaunch')) f.launch = v('fLaunch');
    if (q('fGoal')) f.goal = v('fGoal');
    if (q('fNoAuto')) f.noAuto = c('fNoAuto');
    if (q('fCont')) f.cont = c('fCont');
    if (q('fAll')) f.applyAll = c('fAll');
    IGN.forEach(([k]) => { if (q('fIgn_' + k)) f.ign[k] = c('fIgn_' + k); });
    el.querySelectorAll('[data-split]').forEach(row => { const i = +row.dataset.split; const sp = f.splits[i]; if (!sp) return; sp.cat = row.querySelector('select').value; sp.amtStr = row.querySelector('input').value; });
  };
  const redraw = () => { collect(); draw(); };
  const hints = () => {
    const amt = evalAmount(f.amountStr), h = id => el.querySelector('#' + id);
    if (h('instHint')) h('instHint').textContent = amt > 0 ? `${f.times}x de ${money(f.instMode === 'total' ? round2(amt / f.times) : amt)}${f.instMode === 'total' ? '' : ` · total ${money(round2(amt * f.times))}`}` : '';
    if (h('splitHint')) { const sum = round2(f.splits.reduce((s, x) => s + evalAmount(x.amtStr), 0)), diff = round2(amt - sum);
      h('splitHint').innerHTML = `Distribuído: ${money(sum)}` + (amt > 0 ? ` de ${money(amt)}${diff ? ` · <b class="${diff < 0 ? 'exp' : ''}">${diff < 0 ? 'passou ' + money(-diff) : 'falta ' + money(diff)}</b>` : ''}` : ' (o total será a soma)'); }
    if (h('adjHint')) { const a = evalAmount(f.adjStr); h('adjHint').textContent = a > 0 && amt > 0 ? `Valor final: ${money(round2(amt + (f.adjKind === 'fee' ? 1 : -1) * a))}` : ''; }
  };
  const sw = (id, title, sub, on) => `<label class="check"><span><b>${title}</b>${sub ? `<small>${sub}</small>` : ''}</span><input type="checkbox" class="switch" id="${id}" ${on ? 'checked' : ''}></label>`;

  const draw = () => {
    const cats = catsOf();
    if (!f.cat || !cats.some(c => c.id === f.cat)) f.cat = (f.desc && guessCat(f.desc, f.type)) || cats[0]?.id;

    <form id="txf" style="display:flex;flex-direction:column;gap:10px" novalidate>
      <div class="field"><span>Descrição</span><input id="fDesc" maxlength="80" value="${esc(f.desc)}" list="descList" autocomplete="off" placeholder="${f.type === 'income' ? 'Ex.: Salário, venda' : f.type === 'expense' ? 'Ex.: Mercado, Uber' : 'Ex.: Guardar na reserva'}"><datalist id="descList">${[...new Set(store.allTx().map(x => x.desc))].slice(-80).map(d => `<option value="${esc(d)}">`).join('')}</datalist></div>
      <div class="field"><span>Valor (R$). Pode digitar contas, como 25+18,50</span>
        <div style="display:flex;gap:6px;align-items:center"><input id="fAmount" inputmode="decimal" value="${esc(f.amountStr)}" placeholder="0,00" style="font-size:1.4rem;font-weight:700;color:${tone()}" aria-label="Valor">
        <button type="button" class="icon-btn" id="aClear" aria-label="Limpar valor">${ICO.close}</button>
        <button type="button" class="btn ghost sm" id="aCalc" title="Calcular a conta digitada">=</button></div></div>
      <div class="chips">${[1, 5, 10, 50].map(n => `<button type="button" class="chip" data-plus="${n}" style="border:0;cursor:pointer;padding:6px 12px;color:${tone()}">+ R$ ${n}</button>`).join('')}</div>
      ${!editing ? `<div class="field"><span>Repetição</span><select id="fRep"><option value="no" ${f.rep === 'no' ? 'selected' : ''}>Não recorrente</option><option value="inst" ${f.rep === 'inst' ? 'selected' : ''}>Parcelar ou repetir</option><option value="fixed" ${f.rep === 'fixed' ? 'selected' : ''}>Fixa mensal</option></select></div>
        ${f.rep === 'inst' ? `<div class="grid2"><div class="field"><span>Quantidade</span><input type="number" id="fTimes" min="2" max="120" value="${f.times}"></div><div class="field"><span>A cada</span><select id="fFreq">${[['m', 'Mês'], ['w', 'Semana'], ['2w', '2 semanas'], ['y', 'Ano']].map(([k, l]) => `<option value="${k}" ${f.freq === k ? 'selected' : ''}>${l}</option>`).join('')}</select></div></div>
          <div class="field"><span>O valor digitado é</span><select id="fInstMode"><option value="total" ${f.instMode === 'total' ? 'selected' : ''}>O total (dividir em parcelas)</option><option value="each" ${f.instMode === 'each' ? 'selected' : ''}>De cada vez (repetir o valor)</option></select></div>
          <p class="muted" style="margin:0;font-size:.82rem" id="instHint"></p>` : ''}
        ${f.rep === 'fixed' ? `<div class="field"><span>Lançar nos próximos (meses)</span><input type="number" id="fMonths" min="2" max="60" value="${f.fixedMonths}"></div>` : ''}` :
        (t.group ? sw('fAll', 'Aplicar às próximas', 'Altera também as parcelas ou repetições seguintes', f.applyAll) : '')}
      ${f.type === 'expense' && !editing ? sw('fMulti', 'Multicategorias', 'Divida o valor entre várias categorias', f.multi) : ''}
      <div class="field"><span>Data de vencimento</span><input type="date" id="fDate" value="${f.date}"></div>
      ${f.type !== 'transfer' ? sw('fPaid', 'Efetivada', f.type === 'income' ? 'O dinheiro já entrou' : 'Já foi paga', f.paid) : ''}
      ${f.type === 'transfer' ? `<div class="grid2"><div class="field"><span>De</span><select id="fFrom">${opts(D().accounts, f.from)}</select></div><div class="field"><span>Para</span><select id="fTo">${opts(D().accounts, f.to)}</select></div></div>` :
      (f.multi ? `<div class="panel" style="padding:10px;display:flex;flex-direction:column;gap:8px"><span class="lbl">Divisão por categoria</span>
          ${f.splits.map((sp, i) => `<div data-split="${i}" style="display:flex;gap:6px;align-items:center"><div class="field" style="flex:1.4"><select aria-label="Categoria">${opts(cats, sp.cat)}</select></div><div class="field" style="flex:1"><input inputmode="decimal" placeholder="0,00" value="${esc(sp.amtStr || '')}" aria-label="Valor"></div><button type="button" class="icon-btn" data-rmsplit="${i}" aria-label="Remover">${ICO.close}</button></div>`).join('')}
          <button type="button" class="btn ghost sm" id="addSplit" style="align-self:flex-start">Adicionar categoria</button>
          <p class="muted" style="margin:0;font-size:.82rem" id="splitHint"></p></div>` :
      `<div class="field"><span>Categoria</span><div style="display:flex;gap:6px"><select id="fCat" style="flex:1">${opts(cats, f.cat)}</select><button type="button" class="btn ghost sm" id="newCat" aria-label="Nova categoria">+</button></div></div>
       <div class="field"><span>Subcategoria</span><div style="display:flex;gap:6px"><select id="fSub" style="flex:1">${subOpts(f.cat, f.sub)}</select><button type="button" class="btn ghost sm" id="newSub" aria-label="Nova subcategoria">+</button></div></div>`) +
      `<div class="field"><span>${f.type === 'income' ? 'Conta' : 'Conta ou cartão'}</span><select id="fSrc">${D().accounts.filter(a => !a.archived || f.src === 'a:' + a.id).map(a => `<option value="a:${a.id}" ${f.src === 'a:' + a.id ? 'selected' : ''}>${esc(a.name)}</option>`).join('')}${f.type === 'expense' ? D().cards.map(c => `<option value="c:${c.id}" ${f.src === 'c:' + c.id ? 'selected' : ''}>Cartão ${esc(c.name)}</option>`).join('') : ''}</select></div>`}
      <div class="field"><span>Tags (separe por vírgula)</span><input id="fTags" value="${esc(f.tagsStr)}" list="tagList"><datalist id="tagList">${D().tags.map(x => `<option value="${esc(x)}">`).join('')}</datalist></div>
      ${!editing ? sw('fCont', 'Salvar e continuar', 'Deixa o formulário aberto para o próximo lançamento', f.cont) : ''}
      <button type="button" class="btn ghost sm" id="toggleMore" style="align-self:center;color:${tone()}" aria-expanded="${f.more}">${f.more ? 'Menos informações' : 'Mais informações'}</button>
      ${f.more ? `<div style="display:flex;flex-direction:column;gap:10px">
        ${f.type !== 'transfer' && f.paid ? `<div class="field"><span>Data de efetivação</span><input type="date" id="fPaidDate" value="${f.paidDate || f.date}"></div>` : ''}
        <div class="field"><span>Data e hora do lançamento</span><input type="datetime-local" id="fLaunch" value="${esc(f.launch)}"></div>
        ${f.type !== 'transfer' ? `<div class="field"><span>Encargos ou desconto</span><div class="seg" style="margin-bottom:6px"><button type="button" data-adj="fee" class="${f.adjKind === 'fee' ? 'on' : ''}">Encargos (juros, multa)</button><button type="button" data-adj="disc" class="${f.adjKind === 'disc' ? 'on' : ''}">Desconto</button></div>
          <input id="fAdj" inputmode="decimal" placeholder="0,00" value="${esc(f.adjStr)}" aria-label="Valor do ajuste">
          <small class="muted" id="adjHint"></small></div>` : ''}
        <div class="field"><span>Observações e hashtags</span><textarea id="fNote" maxlength="500" placeholder="Escreva #viagem ou #casa para virar tag" style="min-height:60px">${esc(f.note)}</textarea></div>
        ${assetsCap ? `<div class="field"><span>Anexos (foto do recibo, nota fiscal em PDF)</span>
          ${f.att.map((a, i) => `<div style="display:flex;gap:8px;align-items:center"><a href="${esc(a.url)}" target="_blank" rel="noopener" style="flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--fg)">${esc(a.name)}</a><button type="button" class="icon-btn" data-rmatt="${i}" aria-label="Remover anexo">${ICO.close}</button></div>`).join('')}
          <label class="btn ghost sm" style="align-self:flex-start">Adicionar anexo<input type="file" id="fAtt" accept="image/*,application/pdf" hidden></label></div>` : ''}
        ${D().goals.length && f.type !== 'transfer' ? `<div class="field"><span>Criar depósito equivalente para o objetivo</span><select id="fGoal"><option value="">Nenhum</option>${opts(D().goals, f.goal)}</select></div>` : ''}
        ${f.type !== 'transfer' && !f.paid && S().autoPay ? sw('fNoAuto', 'Não efetivar automaticamente', 'Fica pendente mesmo depois da data, até você confirmar', f.noAuto) : ''}
        ${IGN.map(([k, l]) => sw('fIgn_' + k, l, '', f.ign[k])).join('')}
      </div>` : ''}
      <div class="btnrow"><button class="btn" style="flex:1;background:${tone()};color:#fff">${editing ? 'Salvar' : 'Adicionar'}</button>${editing ? '<button type="button" class="btn danger" id="fDel">Excluir</button>' : ''}</div>
    </form>`;

    el.querySelectorAll('[data-ty]').forEach(b => b.onclick = () => { collect(); f.type = b.dataset.ty; f.cat = null; f.sub = ''; f.multi = false; draw(); });
    el.querySelectorAll('[data-plus]').forEach(b => b.onclick = () => { collect(); f.amountStr = fmtInput(evalAmount(f.amountStr) + +b.dataset.plus); draw(); });
    el.querySelector('#aClear').onclick = () => { collect(); f.amountStr = ''; draw(); el.querySelector('#fAmount').focus(); };
    el.querySelector('#aCalc').onclick = () => { collect(); f.amountStr = fmtInput(evalAmount(f.amountStr)); draw(); };
    el.querySelector('#txf').addEventListener('input', () => { collect(); hints(); });
    ['fRep', 'fFreq', 'fInstMode', 'fPaid', 'fCat'].forEach(id => el.querySelector('#' + id)?.addEventListener('change', () => { if (id === 'fCat') el.querySelector('#fSub').value = ''; redraw(); }));
    el.querySelector('#fMulti')?.addEventListener('change', e => { collect(); f.multi = e.target.checked; if (f.multi && !f.splits.length) f.splits = [{cat: f.cat, amtStr: f.amountStr}, {cat: catsOf()[1]?.id, amtStr: ''}]; draw(); });
    el.querySelector('#addSplit')?.addEventListener('click', () => { collect(); f.splits.push({cat: catsOf()[0]?.id, amtStr: ''}); draw(); });
    el.querySelectorAll('[data-rmsplit]').forEach(b => b.onclick = () => { collect(); f.splits.splice(+b.dataset.rmsplit, 1); draw(); });
    el.querySelectorAll('[data-adj]').forEach(b => b.onclick = () => { collect(); f.adjKind = b.dataset.adj; draw(); });
    el.querySelector('#toggleMore').onclick = () => { collect(); f.more = !f.more; draw(); };
    el.querySelector('#fDesc').addEventListener('change', () => { if (!S().autoCat || editing) return; const g = guessCat(el.querySelector('#fDesc').value, f.type); const sel = el.querySelector('#fCat'); if (g && sel && g !== sel.value && [...sel.options].some(o => o.value === g)) { sel.value = g; f.cat = g; f.sub = ''; el.querySelector('#fSub').innerHTML = subOpts(g, ''); } });
    hints();
    el.querySelector('#newCat')?.addEventListener('click', () => { collect(); quickName('Nova categoria', name => { const c = {id: uid(), type: f.type === 'income' ? 'income' : 'expense', name, color: PALETTE[D().cats.length % PALETTE.length], subs: []}; D().cats.push(c); store.saveData(); f.cat = c.id; f.sub = ''; draw(); }); });
    el.querySelector('#newSub')?.addEventListener('click', () => { collect(); quickName('Nova subcategoria em ' + cat(f.cat).name, name => { const c = D().cats.find(x => x.id === f.cat); c.subs ||= []; const s = {id: uid(), name}; c.subs.push(s); store.saveData(); f.sub = s.id; draw(); }); });
    el.querySelector('#fAtt')?.addEventListener('change', async e => {
      const file = e.target.files[0]; if (!file) return; collect();
      if (file.size > 10 * 1024 * 1024) { toast('Arquivo grande demais. O limite é 10 MB.'); return; }
      toast('Enviando anexo...');
      try { const r = await assetsCap.upload(file); f.att.push({id: r.id, url: r.url, name: file.name}); toast('Anexo adicionado.'); } catch { toast('Não foi possível enviar o anexo.'); }
      draw();
    });
    el.querySelectorAll('[data-rmatt]').forEach(b => b.onclick = () => { collect(); const [a] = f.att.splice(+b.dataset.rmatt, 1); if (a && !(t.att || []).some(x => x.id === a.id)) assetsCap?.delete(a.id).catch(() => {}); draw(); });
    el.querySelector('#fDel')?.addEventListener('click', () => { el.closest('.sheet-bg').remove(); deleteTx(t); });
    el.querySelector('#txf').onsubmit = e => { e.preventDefault(); collect(); if (save()) { if (f.cont && !editing) { Object.assign(f, {amountStr: '', desc: '', note: '', splits: f.multi ? [{cat: f.cat, amtStr: ''}] : [], att: [], goal: ''}); draw(); el.querySelector('#fDesc').focus(); } else el.closest('.sheet-bg').remove(); } };
  };

  const save = () => {
    let amount = evalAmount(f.amountStr);
    const parts = f.multi && f.type === 'expense' ? f.splits.map(s => ({cat: s.cat, sub: '', amt: evalAmount(s.amtStr)})).filter(s => s.amt > 0) : [{cat: f.cat, sub: f.sub, amt: amount}];
    if (f.multi) { const sum = round2(parts.reduce((s, p) => s + p.amt, 0)); if (!parts.length) { toast('Informe o valor de cada categoria.'); return false; } if (amount > 0 && Math.abs(sum - amount) > 0.009) { toast(`A divisão soma ${money(sum)}, mas o total é ${money(amount)}.`); return false; } amount = sum; }
    if (!(amount > 0)) { toast('Digite um valor maior que zero.'); return false; }
    const adjV = f.type === 'transfer' ? 0 : evalAmount(f.adjStr), adjSign = f.adjKind === 'fee' ? 1 : -1;
    if (adjV > 0) { parts[0].amt = round2(parts[0].amt + adjSign * adjV); amount = round2(amount + adjSign * adjV); if (!(parts[0].amt > 0)) { toast('O desconto é maior que o valor.'); return false; } }
    if (!f.desc.trim()) { toast('Escreva uma descrição.'); return false; }
    if (!f.date) { toast('Escolha a data de vencimento.'); return false; }
    const hashtags = [...f.note.matchAll(/#([\wÀ-ú-]+)/g)].map(m => m[1]);
    const tags = [...new Set([...f.tagsStr.split(',').map(x => x.trim().replace(/^#/, '')).filter(Boolean), ...hashtags])];
    tags.forEach(x => { if (!D().tags.includes(x)) D().tags.push(x); });
    const ign = Object.fromEntries(Object.entries(f.ign).filter(([, v]) => v));
    const common = {type: f.type, desc: f.desc.trim(), tags, note: f.note.trim(), created: t.created || Date.now(), launch: f.launch || undefined};
    if (adjV > 0) common.adj = {kind: f.adjKind, v: adjV};
    if (f.att.length) common.att = f.att;
    if (Object.keys(ign).length) common.ign = ign;
    if (f.type === 'transfer') { if (f.from === f.to) { toast('Escolha contas diferentes.'); return false; } Object.assign(common, {account: f.from, to: f.to, paid: true}); }
    else { if (f.src.startsWith('c:')) common.card = f.src.slice(2); else common.account = f.src.slice(2); common.paid = f.paid; if (f.paid) common.paidDate = f.paidDate && f.paidDate !== f.date ? f.paidDate : undefined; if (!f.paid && f.noAuto) common.noAuto = true; }

    if (editing) {
      const base = {...common, id: t.id, amount, date: f.date, cat: f.type === 'transfer' ? undefined : f.cat, sub: f.sub || undefined, group: t.group, inst: t.inst, fixed: t.fixed, split: t.split, goal: t.goal};
      if (f.goal && f.goal !== t.goal) { const g = D().goals.find(x => x.id === f.goal); if (g) { g.saved = round2(g.saved + amount); base.goal = f.goal; } }
      if (f.applyAll && t.group) store.allTx().filter(x => x.group === t.group && x.date > t.date).forEach(x => store.updateTx({...x, desc: base.desc, amount: base.amount, cat: base.cat, sub: base.sub, account: base.account, card: base.card, tags: base.tags, ign: base.ign}));
      store.updateTx(JSON.parse(JSON.stringify(base))); store.saveData(); render(); toast('Lançamento salvo.'); return true;
    }
    const created = []; const splitId = parts.length > 1 ? uid() : undefined;
    for (const p of parts) {
      const n = f.rep === 'inst' ? Math.max(2, Math.min(120, f.times)) : f.rep === 'fixed' ? Math.max(2, Math.min(60, f.fixedMonths)) : 1;
      const group = n > 1 ? uid() : undefined;
      const each = f.rep === 'inst' && f.instMode === 'total' ? round2(p.amt / n) : p.amt;
      for (let i = 0; i < n; i++) {
        const x = {...common, id: uid(), amount: f.rep === 'inst' && f.instMode === 'total' && i === n - 1 ? round2(p.amt - each * (n - 1)) : each,
          date: n > 1 ? addPeriod(f.date, i, f.rep === 'fixed' ? 'm' : f.freq) : f.date, cat: f.type === 'transfer' ? undefined : p.cat, sub: p.sub || undefined, group, split: splitId};
        if (i > 0 && f.type !== 'transfer') { x.paid = false; delete x.paidDate; }
        if (f.rep === 'inst') x.inst = {n: i + 1, of: n}; if (f.rep === 'fixed') x.fixed = true;
        created.push(JSON.parse(JSON.stringify(x)));
      }
    }
    if (f.goal) { const g = D().goals.find(x => x.id === f.goal); if (g) { const dep = created.filter(x => x.date === f.date).reduce((s, x) => s + x.amount, 0); g.saved = round2(g.saved + dep); created.filter(x => x.date === f.date).forEach(x => x.goal = f.goal); } }
    created.forEach(x => store.addTx(x)); store.saveData();
    lowBalanceCheck(created[0]);
    render();
    toast(created.length > 1 ? `${created.length} lançamentos criados.` : 'Lançamento adicionado.', () => { created.forEach(x => store.removeTx(x.id)); if (f.goal) { const g = D().goals.find(x => x.id === f.goal); if (g) { g.saved = round2(g.saved - created.filter(x => x.goal).reduce((s, x) => s + x.amount, 0)); store.saveData(); } } render(); });
    return true;
  };
  sheet('', e => { el = e; draw(); });
}
function nowLocal() { const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`; }
function quickName(title, onOk) {
  sheet(`${sheetHead(title)}<form id="qn" style="display:flex;gap:8px"><div class="field" style="flex:1"><input id="qnName" required maxlength="30" aria-label="Nome"></div><button class="btn">Criar</button></form>`,
    (el, close) => el.querySelector('#qn').onsubmit = e => { e.preventDefault(); const n = el.querySelector('#qnName').value.trim(); if (n) { close(); onOk(n); } });
}
function lowBalanceCheck(t) {
  if (!S().alertLowBalance || t.type !== 'expense' || t.card || !t.account) return;
  const b = accountBalance(t.account, t.date, false);
  if (b < 0) setTimeout(() => toast(`Atenção: ${acc(t.account)?.name} fica com saldo de ${money(b)} em ${brDate(t.date)}.`), 4600);
}
function deleteTx(t) {
  const doDel = all => {
    const gone = all ? store.allTx().filter(x => x.group === t.group && x.date >= t.date) : [t];
    gone.forEach(x => { store.removeTx(x.id); const g = x.goal && D().goals.find(y => y.id === x.goal); if (g) g.saved = round2(g.saved - x.amount); }); store.saveData(); render();
    toast(gone.length > 1 ? `${gone.length} lançamentos excluídos.` : 'Lançamento excluído.', () => { gone.forEach(x => store.addTx(x)); render(); });
  };
  if (t.group) sheet(`${sheetHead('Excluir lançamento')}<p class="muted" style="margin:0">Este lançamento faz parte de uma série.</p><div class="btnrow"><button class="btn danger" id="d1">Só este</button><button class="btn danger" id="dAll">Este e os próximos</button></div>`,
    (el, close) => { el.querySelector('#d1').onclick = () => { close(); doDel(false); }; el.querySelector('#dAll').onclick = () => { close(); doDel(true); }; });
  else doDel(false);
}
function guessCat(desc, type) {
  const n = norm(desc); if (!n) return null;
  const ty = type === 'income' ? 'income' : 'expense';
  const prev = store.allTx().filter(x => x.type === ty && x.cat && norm(x.desc) === n).sort((a, b) => b.date.localeCompare(a.date))[0];
  if (prev) return prev.cat;
  const prefix = store.allTx().filter(x => x.type === ty && x.cat && n.length > 3 && norm(x.desc).startsWith(n.split(' ')[0])).sort((a, b) => b.date.localeCompare(a.date))[0];
  if (prefix) return prefix.cat;
  for (const [name, kws] of Object.entries(KEYWORDS)) if (kws.some(k => (' ' + n + ' ').includes(k))) { const c = D().cats.find(c => c.type === ty && c.name === name); if (c) return c.id; }
  return D().cats.find(c => c.type === ty && c.name === 'Outros')?.id || null;
}

function cardForm(id) {

function parseOFX(text) {
  const out = []; const blocks = text.split(/<STMTTRN>/i).slice(1);
  const get = (b, tag) => (b.match(new RegExp('<' + tag + '>([^<\\r\\n]*)', 'i')) || [])[1]?.trim() || '';
  for (const b of blocks) {
    const amt = parseFloat(get(b, 'TRNAMT').replace(',', '.')); const dt = get(b, 'DTPOSTED');
    if (!dt || isNaN(amt)) continue;
    out.push({date: `${dt.slice(0, 4)}-${dt.slice(4, 6)}-${dt.slice(6, 8)}`, amount: Math.abs(amt), type: amt < 0 ? 'expense' : 'income', desc: (get(b, 'MEMO') || get(b, 'NAME') || 'Sem descrição').replace(/\s+/g, ' '), fitid: get(b, 'FITID')});
  }
  return out;
}
function parseCSV(text) {
  const lines = text.replace(/\r/g, '').split('\n').filter(l => l.trim());
  if (lines.length < 2) return [];
  const sep = (lines[0].match(/;/g) || []).length >= (lines[0].match(/,/g) || []).length ? ';' : ',';
  const split = l => { const r = []; let cur = '', q = false; for (const ch of l) { if (ch === '"') q = !q; else if (ch === sep && !q) { r.push(cur); cur = ''; } else cur += ch; } r.push(cur); return r.map(x => x.trim()); };
  const head = split(lines[0]).map(norm);
  const find = keys => head.findIndex(h => keys.some(k => h.includes(k)));
  let iD = find(['data', 'date']), iDesc = find(['descri', 'histor', 'title', 'estabelec', 'lancamento', 'memo']), iV = find(['valor', 'amount', 'quantia']);
  const iC = find(['credito', 'entrada']), iDb = find(['debito', 'saida']);
  const out = [];
  for (const l of lines.slice(1)) {
    const c = split(l); let d = c[iD] || '';
    const m = d.match(/(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})/), m2 = d.match(/(\d{4})-(\d{2})-(\d{2})/);
    if (m) d = `${m[3].length === 2 ? '20' + m[3] : m[3]}-${pad(m[2])}-${pad(m[1])}`; else if (m2) d = m2[0]; else continue;
    let v = iV >= 0 ? parseMoney(c[iV]) : (parseMoney(c[iC]) || -parseMoney(c[iDb]));
    if (iV >= 0 && /^-|\bD$/i.test((c[iV] || '').trim())) v = -Math.abs(v);
    if (!v) continue;
    out.push({date: d, amount: Math.abs(v), type: v < 0 ? 'expense' : 'income', desc: (c[iDesc] || 'Sem descrição').replace(/\s+/g, ' ')});
  }
  return out;
}
function isDup(x, target) {
  const [k, id] = target.split(':');
  return store.allTx().some(t => (x.fitid && t.fitid === x.fitid) || ((k === 'a' ? t.account === id && !t.card : t.card === id) && t.amount === round2(x.amount) && t.date === x.date && (t.type === x.type || (t.type === 'expense' && k === 'c'))));
}
async function handleImport(file) {

  if (!rows.length) { toast('Não encontrei transações nesse arquivo. Tente o formato OFX.'); return; }
  if (target.startsWith('c:')) rows.forEach(r => { if (r.type === 'income') r.skipDefault = true; }); // em fatura, créditos costumam ser pagamentos
  rows.forEach(r => { r.id = uid(); r.amount = round2(r.amount); r.cat = guessCat(r.desc, r.type); r.dup = isDup(r, target); r.on = !r.dup && !r.skipDefault; });

    };
    el.querySelector('#doImp').onclick = () => {

    items = (Array.isArray(res) ? res : []).filter(x => x && +x.amount > 0).map(x => {

function claudeTools() {
  const findCat = (n, ty) => D().cats.find(c => (!ty || c.type === ty) && norm(c.name) === norm(n));
